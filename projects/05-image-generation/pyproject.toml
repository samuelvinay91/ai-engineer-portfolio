[project]
name = "image-generation"
version = "0.1.0"
description = "Cloud-native Image Generation Service with diffusion models, VAE, and multi-provider support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "Pillow>=10.4.0",
    "replicate>=0.34.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    "aiofiles>=24.1.0",
    "common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "httpx>=0.27.0"]
local = ["torch>=2.4.0", "diffusers>=0.31.0", "transformers>=4.46.0", "accelerate>=1.0.0", "safetensors>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_generation"]
