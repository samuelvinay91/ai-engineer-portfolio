# ---------------------------------------------------------------------------
# Kubernetes deployment for the Capstone Multi-Agent AI Platform
# ---------------------------------------------------------------------------
# Apply with:
#   kubectl apply -f k8s/deployment.yaml
#
# Prerequisites:
#   - Secret "capstone-secrets" with API keys
#   - PostgreSQL instance accessible at the configured DATABASE_URL
#   - Redis instance accessible at the configured REDIS_URL
# ---------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-multiagent
  labels:
    app: capstone-multiagent
    tier: backend
    version: v0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-multiagent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: capstone-multiagent
        tier: backend
    spec:
      serviceAccountName: capstone-multiagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: capstone-multiagent
          image: capstone-multiagent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CAPSTONE_ENVIRONMENT
              value: "production"
            - name: CAPSTONE_LOG_LEVEL
              value: "INFO"
            - name: CAPSTONE_WORKERS
              value: "2"
            - name: CAPSTONE_HOST
              value: "0.0.0.0"
            - name: CAPSTONE_PORT
              value: "8000"
            - name: CAPSTONE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: capstone-secrets
                  key: database-url
            - name: CAPSTONE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: capstone-secrets
                  key: redis-url
            - name: CAPSTONE_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capstone-secrets
                  key: anthropic-api-key
            - name: CAPSTONE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capstone-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi

---
apiVersion: v1
kind: Service
metadata:
  name: capstone-multiagent
  labels:
    app: capstone-multiagent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: capstone-multiagent

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-multiagent
  labels:
    app: capstone-multiagent

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-multiagent
  labels:
    app: capstone-multiagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-multiagent
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
