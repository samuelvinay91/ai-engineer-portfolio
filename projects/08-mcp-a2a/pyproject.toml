[project]
name = "mcp-a2a"
version = "0.1.0"
description = "MCP Server/Client implementation and A2A protocol with AgentCards for agent interoperability"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "structlog>=24.1.0",
    "sse-starlette>=2.0.0",
    "redis>=5.0.0",
    "common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_a2a"]
