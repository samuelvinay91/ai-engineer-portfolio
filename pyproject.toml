[project]
name = "ai-engineer-portfolio"
version = "1.0.0"
description = "Production-grade AI Engineer Portfolio - 8 cloud-native projects covering LLMs, agents, RAG, MCP, and more"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineer", email = "engineer@example.com" }]

[tool.uv.workspace]
members = [
    "libs/*",
    "projects/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["libs", "projects"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["projects"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
