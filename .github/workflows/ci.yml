name: CI Pipeline

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.0"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy libs/ projects/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        project:
          - projects/01-llm-playground
          - projects/02-customer-support-chatbot
          - projects/03-ask-the-web-agent
          - projects/04-deep-research
          - projects/05-image-generation
          - projects/06-capstone-multiagent
          - projects/07-agent-rag
          - projects/08-mcp-a2a
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest ${{ matrix.project }}/tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        project:
          - { name: "llm-playground", path: "projects/01-llm-playground" }
          - { name: "customer-support-chatbot", path: "projects/02-customer-support-chatbot" }
          - { name: "ask-the-web-agent", path: "projects/03-ask-the-web-agent" }
          - { name: "deep-research", path: "projects/04-deep-research" }
          - { name: "image-generation", path: "projects/05-image-generation" }
          - { name: "capstone-multiagent", path: "projects/06-capstone-multiagent" }
          - { name: "agent-rag", path: "projects/07-agent-rag" }
          - { name: "mcp-a2a", path: "projects/08-mcp-a2a" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.project.path }}/Dockerfile
          push: false
          tags: ai-portfolio/${{ matrix.project.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
