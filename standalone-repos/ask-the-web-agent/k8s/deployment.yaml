---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-the-web-agent
  labels:
    app: ask-the-web-agent
    project: ai-engineer-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ask-the-web-agent
  template:
    metadata:
      labels:
        app: ask-the-web-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ask-the-web-agent
          image: ask-the-web-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ask-the-web-secrets
                  key: anthropic-api-key
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ask-the-web-secrets
                  key: tavily-api-key
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ask-the-web-agent
  labels:
    app: ask-the-web-agent
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: ask-the-web-agent
---
apiVersion: v1
kind: Secret
metadata:
  name: ask-the-web-secrets
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"
  tavily-api-key: "REPLACE_ME"
